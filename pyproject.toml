[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-sentinel"
version = "0.1.0"
description = "Enterprise-grade observability and governance platform for multi-agent AI deployments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Project Sentinel Team" },
]
keywords = ["observability", "governance", "ai-agents", "telemetry", "anomaly-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "aiokafka>=0.9",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "ruff>=0.1",
    "httpx>=0.25",
]

[project.urls]
Homepage = "https://github.com/project-sentinel/project-sentinel"
Documentation = "https://github.com/project-sentinel/project-sentinel/docs"
Repository = "https://github.com/project-sentinel/project-sentinel"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
