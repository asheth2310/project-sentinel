# Project Sentinel - Local Development Infrastructure
# Usage: docker compose up -d
# Verify: docker compose ps (all services should be healthy)

services:
  # ─────────────────────────────────────────────────────────────────────
  # Zookeeper - Required for Kafka cluster coordination
  # ─────────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sentinel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sentinel-network
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────
  # Kafka - Event streaming for telemetry pipeline
  # Topics: telemetry-raw, telemetry-enriched, anomaly-events
  # ─────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentinel-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_MESSAGE_MAX_BYTES: 1048576
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sentinel-network
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1G

  # ─────────────────────────────────────────────────────────────────────
  # Kafka Init - Creates required topics on startup
  # Topics: telemetry-raw (6 partitions), telemetry-enriched (6),
  #         anomaly-events (6)
  # ─────────────────────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sentinel-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --replication-factor 1 --partitions 6 --topic telemetry-raw --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --replication-factor 1 --partitions 6 --topic telemetry-enriched --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --replication-factor 1 --partitions 6 --topic anomaly-events --config retention.ms=604800000
      echo 'Kafka topics created successfully.'
      kafka-topics --list --bootstrap-server kafka:29092
      "
    networks:
      - sentinel-network

  # ─────────────────────────────────────────────────────────────────────
  # Kafka UI - Web UI for topic inspection and debugging
  # Access at: http://localhost:8080
  # ─────────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinel-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - sentinel-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────
  # Redis - Circuit breaker state, rate limiting, and caching
  # Configured with AOF persistence and 256MB memory limit
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --save 60 1000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sentinel-network
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 300M

  # ─────────────────────────────────────────────────────────────────────
  # TimescaleDB - Time-series storage for telemetry data
  # PostgreSQL 16 with TimescaleDB extension
  # Stores: telemetry_logs, governance_policies, audit_log, anomaly_events
  # ─────────────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: sentinel-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      TIMESCALEDB_TELEMETRY: "off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sentinel-network
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    shm_size: "256mb"

# ─────────────────────────────────────────────────────────────────────────
# Network Configuration
# ─────────────────────────────────────────────────────────────────────────
networks:
  sentinel-network:
    driver: bridge
    name: sentinel-network

# ─────────────────────────────────────────────────────────────────────────
# Persistent Volumes
# ─────────────────────────────────────────────────────────────────────────
volumes:
  zookeeper-data:
    name: sentinel-zookeeper-data
  zookeeper-log:
    name: sentinel-zookeeper-log
  kafka-data:
    name: sentinel-kafka-data
  redis-data:
    name: sentinel-redis-data
  timescaledb-data:
    name: sentinel-timescaledb-data
